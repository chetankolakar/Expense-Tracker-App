<template>
    <lightning-card style="min-height: 200px; max-height: 400px" class="slds-p-top_small">
        <template if:true={addMultipleExpenses}>
            <div  class="slds-p-top_large">
                <c-create-multiple-expenses onclosemodal={closemodal}></c-create-multiple-expenses>
            </div>
        </template>
        <template if:false={addMultipleExpenses}>
            <div class="slds-m-top_small slds-m-bottom_medium">
                <!-- Brand variant: Identifies the primary action in a group of buttons -->
                <lightning-button variant="brand" label="Add Expenses" title="Primary action" onclick={handleMultipleExpensesClick} class="slds-p-left_none"></lightning-button>
            </div>
        </template>
        <template if:false={addMultipleExpenses}>
            <div class="slds-m-top_small slds-m-bottom_medium">
                <!-- Brand variant: Identifies the primary action in a group of buttons -->
                <lightning-button variant="brand" label="Analyze Expenditure" title="Primary action" onclick={handleAnalyzeExpenditure} class="slds-p-left_none"></lightning-button>
            </div>
        </template>
        <template if:true={showSummary}>
            <div class="slds-p-around_medium lgc-bg">
                <template for:each={summaryData} for:item="summary">
                        <lightning-card  variant="Narrow"   key={summary.catogory}>
                            <lightning-tile >
                                <dl class="slds-dl_horizontal">
                                    <dt class="slds-dl_horizontal__label">
                                        <p class="slds-truncate bold-text" title="Catogory">Catogory:</p>
                                    </dt>
                                    <dd class="slds-dl_horizontal__detail slds-tile__meta">
                                        <p class="slds-truncate" title="Salesforce">{summary.catogory}</p>
                                    </dd>
                                    <dt class="slds-dl_horizontal__label">
                                        <p class="slds-truncate bold-text" title="Last month total">Last month total:</p>
                                    </dt>
                                    <dd class="slds-dl_horizontal__detail slds-tile__meta">
                                        <p class="slds-truncate" title="salesforce-ux@salesforce.com">{summary.lastMonthTotal}</p>
                                    </dd>
                                    <dt class="slds-dl_horizontal__label">
                                        <p class="slds-truncate bold-text" title="This month total">This month total:</p>
                                    </dt>
                                    <dd class="slds-dl_horizontal__detail slds-tile__meta">
                                        <p class="slds-truncate" title="Salesforce">{summary.thisMonthTotal}</p>
                                    </dd>
                                    <dt class="slds-dl_horizontal__label">
                                        <p class="slds-truncate bold-text" title="This month total">Diffrence:</p>
                                    </dt>
                                    <dd class="slds-dl_horizontal__detail slds-tile__meta">
                                        <p class="slds-truncate" title="Salesforce">{summary.diffAmount}</p>
                                    </dd>
                                    <template if:true={summary.result}>
                                        <dt class="slds-dl_horizontal__label">
                                            <p class="slds-truncate bold-text" title="This month total">Precentage Diffrence:</p>
                                        </dt>
                                        <dd class="slds-dl_horizontal__detail slds-tile__meta">
                                            <p class="slds-truncate positive" title="Salesforce"><lightning-formatted-number value={summary.percentChange} maximum-fraction-digits="2" ></lightning-formatted-number>%</p>
                                        </dd>
                                    </template>
                                    <template if:false={summary.result}>
                                        <dt class="slds-dl_horizontal__label">
                                            <p class="slds-truncate bold-text" title="This month total">Precentage Diffrence:</p>
                                        </dt>
                                        <dd class="slds-dl_horizontal__detail slds-tile__meta">
                                            <p class="slds-truncate negative" title="Salesforce"><lightning-formatted-number value={summary.percentChange} maximum-fraction-digits="2" ></lightning-formatted-number>%</p>
                                        </dd>
                                    </template>
                                </dl>
                            </lightning-tile>
                        </lightning-card>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
